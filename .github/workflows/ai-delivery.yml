name: AI delivery pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: ai-delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Baseline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Run baseline and agent utility tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s agents -p 'test_*.py' -v

  ai-tests:
    name: AI-generated tests
    needs: [tests]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate behavioral tests with Gemini
        run: python agents/generate_tests.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      - name: Run generated tests
        run: |
          python agents/run_generated_tests.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ai-test-cases
          path: artifacts/ai_test_cases.json
          if-no-files-found: ignore

  ai-review:
    name: AI pull request review
    needs: [tests]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch base branch
        run: git fetch origin main:refs/remotes/origin/main
      - name: Review diff with Gemini
        run: python agents/review_diff.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      - name: Post review summary to pull request
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('artifacts/ai_review.json', 'utf8'));
            const findings = report.findings.length
              ? report.findings.map((item) => `- **${item.severity.toUpperCase()}** \`${item.file}:${item.line || '?'}\` — ${item.title}\n  ${item.detail}`).join('\n')
              : 'No concrete issues found.';
            const body = `## AI review\n\n${report.summary || 'Review complete.'}\n\n${findings}\n\n_Informational review from this repository's Gemini agent. A human still owns approval and merge._`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ai-review
          path: artifacts/ai_review.json
          if-no-files-found: ignore

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, ai-tests]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
